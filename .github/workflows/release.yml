name: Build Workflow

on:
  push:
    branches:
      - main
    paths:
      - '*.py'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    
      - name: Checkout
        uses: actions/checkout@v3

      - name: Declare some variables
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> "$GITHUB_ENV"
          echo "release_tag=$(date +'%y%m%d%H%M')" >> "$GITHUB_ENV"
        
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      
      - name: Install requirements
        run: |
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
      
      - name: Run PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console --name "wow_addon_manager" "main.py"
      
      - name: Copy config files
        run: |
          copy *.json dist\wow_addon_manager

      - name: Archive build for release
        shell: pwsh
        run: |
          Compress-Archive -Path dist/wow_addon_manager/* -DestinationPath wow_addon_manager.zip -Force
      
      - name: Upload artifacts 
        uses: actions/upload-artifact@v4
        with:
          name: wow_addons_manager
          path: dist/wow_addon_manager
      
      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "${{ env.release_tag }}" -m "Latest release"
          git push origin "${{ env.release_tag }}" --force

      - name: Release  
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "wow_addon_manager.zip"
          commit: ${{ github.sha }}
          tag: ${{ env.release_tag }}
